# Rebuilds docs/ whenever content in src/ (or build.py) changes on main,
# so edits made directly on the GitHub website go live automatically.
# Also runs daily so expired news drops off the pages without anyone touching it.
name: Build site
on:
  push:
    branches: [main]
    paths: ["src/**", "build.py"]
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown
      - run: python3 build.py
      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Rebuild site" && git push)
